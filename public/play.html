<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a1020">
<title>Блеф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee8;--ink:#1d1416;--mut:#6d5d60;--card:#fff;--line:#e2d8d0;--coral:#ff5a4e;--gold:#f6c344}
@media(prefers-color-scheme:dark){:root{--bg:#141012;--ink:#f3ebe6;--mut:#a8999b;--card:#211a1c;--line:#382d30}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--card);color:var(--ink);font:17px/1.5 Rubik,system-ui,sans-serif}
main{min-height:100%;max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);padding-bottom:8px;border-bottom:1px solid var(--line)}
.hd b{font:800 15px Unbounded,sans-serif;color:var(--coral)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
h1{font:800 26px/1.15 Unbounded,sans-serif;margin:0;text-wrap:balance}
h2{font:700 21px/1.25 Unbounded,sans-serif;margin:0;text-wrap:balance}
p{margin:0}.mut{color:var(--mut)}
input,textarea{width:100%;font:17px Rubik,sans-serif;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:none}
input.code{text-transform:uppercase;letter-spacing:.2em;font:800 22px Unbounded,sans-serif;text-align:center}
.btn{width:100%;font:600 16px Unbounded,sans-serif;min-height:52px;border-radius:14px;border:0;background:var(--coral);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:14px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
.warn{background:#fff1c9;color:#5a3d00;border-radius:10px;padding:10px 12px;font-size:15px}
.cnt{font-size:13px;color:var(--mut);text-align:right;margin-top:-6px}
.vb{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;min-height:54px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:17px/1.3 Rubik,sans-serif;cursor:pointer}
.vb i{font:800 normal 14px Unbounded,sans-serif;color:var(--coral)}
.vb:active{border-color:var(--coral)}
.list{display:flex;flex-direction:column;gap:10px}
.center{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.big{font:800 52px/1 Unbounded,sans-serif;color:var(--coral)}
.tm{font:800 15px Unbounded,sans-serif;color:var(--coral);font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.net{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;display:none}
</style>
</head>
<body>
<main id="app"><p class="mut">Подключаюсь…</p></main>
<div class="net" id="net">Нет связи. Переподключаюсь…</div>
<script src="/socket.io/socket.io.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L='ABCDEFGHIJKLMNOPQRSTU';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let pid=store.get('blef-pid');if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set('blef-pid',pid)}
const urlCode=(new URLSearchParams(location.search).get('r')||'').toUpperCase();
const sock=io();let V=null,last='',warn='',err='',t=null;

function join(code,name){sock.emit('p:join',{code,name,pid},a=>{if(a.ok){store.set('blef-me',{code,name});err=''}else{err=a.err;V=null;store.del('blef-me');draw(true)}})}
sock.on('connect',()=>{$('net').style.display='none';const me=store.get('blef-me');if(me&&(!urlCode||urlCode===me.code))join(me.code,me.name);else draw(true)});
sock.on('disconnect',()=>{$('net').style.display='block'});
sock.on('you',v=>{if(!V||V.phase!==v.phase||V.qi!==v.qi)t=v.t??null;V=v;draw()});
sock.on('tick',x=>{t=x;const e=$('tm');if(e)e.textContent=x});
sock.on('kicked',()=>{store.del('blef-me');V=null;err='Ведущий убрал вас из комнаты или вы зашли с другого устройства.';draw(true)});

function head(){return `<div class="hd"><b>БЛЕФ</b><span>${V?`<span class="dot" style="--c:${esc(V.col)}"></span>${esc(V.name)} · ${V.score}`:''}</span></div>`}
function draw(force){
  const{t:_t,...rest}=V||{};const key=JSON.stringify(V?rest:null)+warn+err;if(!force&&key===last)return;last=key;
  const a=$('app');let h=head();
  if(!V){
    h+=`<h1>Играем в «Блеф»</h1><p class="mut">Придумывайте правдоподобную ложь про героев вечера и угадывайте правду.</p>
    <form id="jf"><label>Код комнаты<input class="code" id="code" maxlength="4" autocomplete="off" value="${esc(urlCode||store.get('blef-me')?.code||'')}" required></label>
    <label>Ваше имя<input id="nm" maxlength="18" autocomplete="name" value="${esc(store.get('blef-me')?.name||'')}" placeholder="Например, тётя Света" required></label>
    ${err?`<p class="warn">${esc(err)}</p>`:''}<button class="btn">Войти</button></form>`;
  }else if(V.phase==='lobby')h+=`<div class="center"><h1>Вы в игре!</h1><p class="mut">${esc(V.title)}</p><p class="mut">Смотрите на большой экран — ведущий скоро начнёт.</p></div>`;
  else if(V.phase==='write'){
    if(V.lie==null)h+=`<p class="mut">Вопрос ${V.qi+1} из ${V.total} · <span class="tm" id="tm">${t??''}</span></p><h2>${esc(V.q)}</h2>
      <form id="lf"><textarea id="lie" rows="3" maxlength="60" placeholder="Придумайте правдоподобную ложь" aria-label="Ваша ложь"></textarea><p class="cnt" id="cnt">0 / 60</p>${warn?`<p class="warn">${esc(warn)}</p>`:''}<button class="btn">Отправить</button></form>`;
    else h+=`<div class="center"><h2>Ложь принята</h2><p class="mut">«${esc(V.lie)}»</p><p class="mut">Ждём остальных гостей…</p></div>`;
  }else if(V.phase==='vote'){
    if(V.voted==null)h+=`<p class="mut">Где правда? · <span class="tm" id="tm">${t??''}</span></p><h2>${esc(V.q)}</h2><div class="list">${V.opts.map(o=>`<button class="vb" data-v="${o.i}"><i>${L[o.i]}</i><span>${esc(o.text)}</span></button>`).join('')}</div><p class="mut" style="font-size:14px">Свой вариант не показываем.</p>`;
    else h+=`<div class="center"><h2>Голос принят</h2><p class="mut">Вы выбрали «${esc(V.voted)}»</p></div>`;
  }else if(V.phase==='reveal')h+=`<div class="center"><h2>Смотрите на экран</h2><p class="mut">Сейчас станет ясно, кто кого обманул.</p></div>`;
  else h+=`<div class="center">${V.phase==='round'?`<p class="mut">За этот вопрос</p><p class="big">+${V.delta}</p>`:`<h1>Игра окончена</h1><p class="big">${V.score}</p>`}<p>Вы на ${V.place}-м месте из ${V.n}</p></div>`;
  a.innerHTML=h;
  const jf=$('jf');if(jf)jf.onsubmit=e=>{e.preventDefault();join($('code').value.trim().toUpperCase(),$('nm').value.trim())};
  const lf=$('lf');if(lf){const ta=$('lie');ta.oninput=()=>$('cnt').textContent=ta.value.length+' / 60';
    lf.onsubmit=e=>{e.preventDefault();const v=ta.value.trim();if(!v)return;const b=lf.querySelector('button');b.disabled=true;
      sock.emit('p:lie',v,r=>{b.disabled=false;if(r.ok)warn='';else{warn=r.warn||'';const keep=ta.value;draw(true);if($('lie')){$('lie').value=keep}}})}}
  a.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{a.querySelectorAll('[data-v]').forEach(x=>x.disabled=true);sock.emit('p:vote',+b.dataset.v)});
  if(V&&V.phase!=='write')warn='';
}
}
</script>
</body>
</html>
